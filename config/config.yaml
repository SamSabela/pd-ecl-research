# =============================================================================
# Master configuration
#
# Every threshold, path, seed and rule that affects a reported number lives
# here. Nothing that changes a result may be hard-coded in src/ or notebooks/.
# This is the operational form of the reproducibility claim in Section 3.10:
# every reported figure is traceable to a named configuration version.
# =============================================================================

meta:
  config_version: "0.1.0"
  student_number: "ST10517781"
  python_version: "3.14"          # NOTE: methodology text says 3.11 - update it

seed: 20260815

paths:
  data_raw: "data/raw"
  data_interim: "data/interim"
  data_processed: "data/processed"
  data_external: "data/external"
  outputs: "outputs"
  figures: "outputs/figures"
  tables: "outputs/tables"
  models: "outputs/models"
  logs: "outputs/logs"
  provenance_log: "outputs/logs/provenance.jsonl"
  cleaning_log: "outputs/logs/cleaning.jsonl"
  tuning_log: "outputs/logs/tuning.jsonl"

# -----------------------------------------------------------------------------
# Sample construction - Section 3.4
# -----------------------------------------------------------------------------
sample:
  data_cutoff: "2018-12-31"

  # Outcome definition - Table 3.2
  outcome:
    default_statuses: ["Charged Off", "Default"]
    non_default_statuses: ["Fully Paid"]
    exclude_credit_policy: true

  # Maturity filter - Section 3.4.2
  # Latest admissible origination date per contractual term, so that the term
  # had fully elapsed by the data cutoff.
  maturity_filter:
    enabled: true
    term_cutoffs:
      36: "2015-12-31"
      60: "2013-12-31"
    # Primary sample scope - added 12 September 2026
  # 60-month loans default at 25.16% against 13.90%, and the maturity filter
  # admits them only to 2013, so term mix is confounded with calendar time.
  term_scope:
    primary_term_months: 36
    robustness_term_months: 60

# -----------------------------------------------------------------------------
# Partitioning - Section 3.4.3
# Revised 12 September 2026: rolling-origin backtesting replaces the single
# row-count out-of-time split. See the concept reference for the reasoning.
# -----------------------------------------------------------------------------
partition:
  method: "rolling_origin"
  date_column: "issue_d"
  stratify_within_cv_folds: true

  rolling_origin:
    folds:
      - {train_end: "2012-12-31", evaluate_end: "2013-12-31"}
      - {train_end: "2013-12-31", evaluate_end: "2014-12-31"}
      - {train_end: "2014-12-31", evaluate_end: "2015-12-31"}
    embargo_months: 0
    embargo_months_robustness: 36

  # Retained to reproduce the ICE Task 2 figures. Not the study's scheme.
  legacy_out_of_time:
    train_share: 0.70
    validation_share: 0.15
    test_share: 0.15

# -----------------------------------------------------------------------------
# Leakage control - Section 3.5.1
# -----------------------------------------------------------------------------
leakage:
  univariate_auc_flag_threshold: 0.90
  enforce_register: true

# -----------------------------------------------------------------------------
# Feature preparation - Section 3.5.2
# -----------------------------------------------------------------------------
features:
  winsorise: {enabled: true, lower_percentile: 0.01, upper_percentile: 0.99}
  logistic_pipeline:
    encoding: "woe"
    information_value_min: 0.02
    information_value_review: 0.50
    vif_threshold: 5.0
    impute: "median"
    missingness_indicators: true
  tree_pipeline:
    encoding: "target_smoothed"
    impute: "native"
    scaling: false

# -----------------------------------------------------------------------------
# Feature blocks - Section 3.5.3 / Table 3.5
# -----------------------------------------------------------------------------
feature_blocks:
  A: {description: "Borrower and credit-bureau features only (control)", macro_panel: null}
  B: {description: "A + six contemporaneous US macro series (benchmark)", macro_panel: "us"}
  C: {description: "A + six South African series (contextualisation)", macro_panel: "za"}

# -----------------------------------------------------------------------------
# Macroeconomic panels - Section 3.5.3 / Table 3.6
# publication_lag_months is applied explicitly: a series is visible to an
# observation only from (reference period end + lag).
# -----------------------------------------------------------------------------
macro:
  apply_publication_lag: true
  za_series:
    - {name: repo_rate,         frequency: monthly,   source: SARB,    publication_lag_months: 0}
    - {name: cpi_yoy,           frequency: monthly,   source: StatsSA, publication_lag_months: 1}
    - {name: gdp_growth_yoy,    frequency: quarterly, source: StatsSA, publication_lag_months: 3}
    - {name: unemployment_qlfs, frequency: quarterly, source: StatsSA, publication_lag_months: 3}
    - {name: usdzar,            frequency: daily,     source: FRED, series_id: DEXSFUS,        publication_lag_months: 0}
    - {name: za_10y_yield,      frequency: monthly,   source: FRED, series_id: IRLTLT01ZAM156N, publication_lag_months: 0}
  us_series:
    - {name: fed_funds_rate,    frequency: monthly,   source: FRED, series_id: FEDFUNDS, publication_lag_months: 0}
    - {name: cpi_yoy,           frequency: monthly,   source: FRED, series_id: CPIAUCSL, publication_lag_months: 1}
    - {name: gdp_growth_yoy,    frequency: quarterly, source: FRED, series_id: GDPC1,    publication_lag_months: 3}
    - {name: unemployment,      frequency: monthly,   source: FRED, series_id: UNRATE,   publication_lag_months: 1}
    - {name: usd_index,         frequency: daily,     source: FRED, series_id: DTWEXBGS, publication_lag_months: 0}
    - {name: us_10y_yield,      frequency: monthly,   source: FRED, series_id: GS10,     publication_lag_months: 0}

# -----------------------------------------------------------------------------
# Models - Section 3.6. Equal budget across families is what makes it fair.
# -----------------------------------------------------------------------------
models:
  tuning_budget_trials: 60
  cv_folds: 5
  families: ["logistic_regression", "random_forest", "xgboost", "lightgbm", "catboost"]
  calibration:
    methods: ["platt", "isotonic"]
    selection_metric: "brier"

# -----------------------------------------------------------------------------
# IFRS 9 staging - Section 3.8.3 / Table 3.8
# -----------------------------------------------------------------------------
staging:
  reporting_date_months_after_origination: 12
  sicr:
    relative_threshold: 2.0
    relative_sensitivity: [1.5, 2.0, 3.0]
    absolute_threshold: 0.05
    absolute_sensitivity: [0.03, 0.05, 0.10]
  stage3_days_past_due: 90

# -----------------------------------------------------------------------------
# ECL - Section 3.8.3 / Table 3.9
# -----------------------------------------------------------------------------
ecl:
  lgd: 0.45
  lgd_sensitivity: [0.30, 0.45, 0.60]
  stage1_horizon_months: 12
  discounting: "contractual_rate"
  hazard: {method: "constant", validate_against_observed: true}

# -----------------------------------------------------------------------------
# Stress scenarios - Section 3.8.4 / Table 3.10
# -----------------------------------------------------------------------------
stress:
  scenarios:
    baseline: {rule: "median"}
    moderate: {rule: "percentile", adverse_percentile: 0.90}
    severe:   {rule: "percentile", adverse_percentile: 0.99}
  check_correlation_coherence: true
  hold_borrower_features_fixed: true

# -----------------------------------------------------------------------------
# Evaluation - Section 3.8.2 / Table 3.7
# -----------------------------------------------------------------------------
evaluation:
  discrimination: ["auc", "gini", "ks"]
  calibration: ["brier", "brier_decomposition", "hosmer_lemeshow", "ece"]
  bootstrap_replicates: 2000
  multiple_comparison_correction: "holm"
  drift: ["psi", "csi"]
  fairness:
    enabled: true
    metrics: ["disparate_impact_ratio", "equal_opportunity_difference"]
    proxy_segments: ["addr_state", "emp_length", "home_ownership"]

gates:
  G1: {name: "Sample definition sign-off", date: "2026-09-02"}
  G3: {name: "Specification freeze - test partition unlocked", date: "2026-09-30"}
